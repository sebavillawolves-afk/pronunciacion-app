<!DOCTYPE html>
<html lang="es" class="nojs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronunciación en inglés</title>
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pronunciación">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<style>
:root{
  --paper:#F7F8FA; --surface:#FFFFFF; --ink:#1D2733; --muted:#5B6675; --line:#DDE2E8;
  --mark:#FFE27A; --mark-ink:#3A2E00; --accent:#1F5F8B; --accent-soft:#E3EEF6;
  --ok:#2E7D4F; --bad:#B3261E;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --head:"Literata", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161C; --surface:#18202A; --ink:#E4E8EE; --muted:#9AA5B3; --line:#2A333D;
    --mark:#5C4B0E; --mark-ink:#FFE9A3; --accent:#7FB3D9; --accent-soft:#1D2D3C;
    --ok:#6FCF97; --bad:#F2A19B;
  }
}
:root[data-theme="dark"]{
  --paper:#11161C; --surface:#18202A; --ink:#E4E8EE; --muted:#9AA5B3; --line:#2A333D;
  --mark:#5C4B0E; --mark-ink:#FFE9A3; --accent:#7FB3D9; --accent-soft:#1D2D3C;
  --ok:#6FCF97; --bad:#F2A19B;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.title-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding-top:14px}
h1{white-space:nowrap}
h1{font-family:var(--head);font-weight:700;font-size:1.55rem;margin:0;letter-spacing:-0.01em}
h1 .say{background:var(--mark);color:var(--mark-ink);padding:0 .25em;border-radius:2px}
.count{color:var(--muted);font-size:.9rem;white-space:nowrap}
.search{width:100%;margin:12px 0 10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:10px 12px;color:var(--muted);border-bottom:3px solid transparent;font-weight:700}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding:14px 0 40px}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.filters select{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.small{padding:6px 10px;font-size:.88rem}

.list{list-style:none;margin:0;padding:0}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.entry-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.word{font-family:var(--head);font-weight:700;font-size:1.25rem;line-height:1.2}
.cat{color:var(--muted);font-size:.82rem;margin-top:2px}
.lvl{font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.lvl.d{border-color:#C9A227;color:#8A6D00}
.lvl.m{border-color:var(--bad);color:var(--bad)}
.phon{display:inline-block;margin-top:8px;font-weight:700;font-size:1.15rem;background:var(--mark);color:var(--mark-ink);padding:1px 8px;border-radius:3px}
.es{margin-top:6px}
.ex{margin-top:6px;color:var(--muted);font-style:italic}
.note{margin-top:8px;font-size:.9rem;border-left:3px solid var(--accent);padding-left:10px}
.forms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.form{background:var(--paper);border-radius:8px;padding:8px}
.form small{display:block;color:var(--muted);font-size:.75rem}
.form b{display:block;font-family:var(--head)}
.form span{display:block;font-size:.9rem;background:var(--mark);color:var(--mark-ink);width:fit-content;padding:0 5px;border-radius:2px;margin-top:2px}
.edtag{margin-top:8px;font-size:.88rem;color:var(--muted)}
.row-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:700;font-size:.9rem}
.linkbtn.del{color:var(--muted);font-weight:400}
.cbody{margin:8px 0 0}
.concept .note{margin-top:10px}
.tenses{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.tense{margin-bottom:10px}
.tense h4{margin:0 0 4px;font-size:.85rem;color:var(--accent)}
.tline{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:2px 0}
.tline em{font-style:normal;font-family:var(--head)}
.tline .aux{font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.tline span{font-size:.88rem;color:var(--mark-ink);background:var(--mark);padding:0 5px;border-radius:2px}
.more{display:block;margin:14px auto 0}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

.guide h2{font-family:var(--head);font-size:1.3rem;margin:4px 0 6px}
.guide p.lead{color:var(--muted);margin:0 0 14px}
.guide .entry h3{font-family:var(--head);margin:0 0 4px;font-size:1.1rem}
.guide .use{color:var(--muted);font-size:.92rem;margin:0 0 8px}
.guide .struct{font-weight:700;margin:6px 0}

.quiz-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:center;margin-top:6px}
.quiz-prompt{font-family:var(--head);font-weight:700;font-size:1.9rem;line-height:1.2;margin:6px 0}
.quiz-sub{color:var(--muted)}
.options{display:grid;gap:8px;margin-top:16px}
.opt{border:1px solid var(--line);background:var(--paper);padding:12px;border-radius:10px;font-weight:700;font-size:1.05rem}
.opt.right{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.score{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-top:10px}
.reveal{margin-top:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:99px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}

dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px;display:grid;gap:10px}
.dlg h3{margin:0;font-family:var(--head)}
.dlg input,.dlg select,.dlg textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg .err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end}
.pron{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px}
.pron .phon{margin-top:0}
.ipa{font-family:"Segoe UI","Noto Sans","DejaVu Sans","Lucida Grande","Arial Unicode MS",sans-serif;color:var(--muted);font-size:1rem}
.spk{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;padding:0;vertical-align:middle}
.spk svg{width:18px;height:18px}
.spk.sm{width:26px;height:26px}.spk.sm svg{width:14px;height:14px}
.spk:active{background:var(--accent-soft)}
.ex .spk,.tline .spk{margin-right:6px}
.form .ipa{display:block;font-size:.8rem;margin-top:2px}
.form .spk{margin-top:4px}
.speed{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:.82rem;font-weight:700;color:var(--muted)}
.chart{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.snd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.snd-head{display:flex;align-items:center;gap:10px}
.sym{font-family:"Segoe UI","Noto Sans","DejaVu Sans","Lucida Grande",sans-serif;font-size:2rem;font-weight:700;min-width:2.4em;text-align:center;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:2px 6px}
.lv{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.lv.nuevo{border-color:var(--bad);color:var(--bad)}
.lv.igual{border-color:var(--ok);color:var(--ok)}
.snd p{margin:8px 0;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 10px;font-size:.88rem}
.chip i{font-style:normal;color:var(--muted);margin-left:4px;font-family:"Segoe UI","Noto Sans","DejaVu Sans",sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:560px;margin:0 auto}
#toast.show{opacity:1}
.diag{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.9rem}
@media (max-width:420px){.forms{grid-template-columns:1fr 1fr 1fr}.word{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.nojs .search,.nojs .tabs,.nojs .speed{display:none}
.st-nav{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.st-nav a{color:var(--accent);font-weight:700;text-decoration:none;display:inline-block;margin:3px 12px 3px 0}
.st-h2{font-family:var(--head);font-size:1.4rem;margin:26px 0 4px}
.st-h3{font-size:1rem;color:var(--accent);margin:16px 0 8px}
.st-top{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="title-row">
      <h1>Pronunciación <span class="say">en inglés</span></h1>
      <span class="count"><span id="count"></span> <button type="button" class="speed" id="speed"></button></span>
    </div>
    <input class="search" id="search" type="search" placeholder="Buscar en inglés, fonética o español" aria-label="Buscar">
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>

<dialog id="dlg">
  <form class="dlg" method="dialog" id="addForm">
    <h3>Agregar palabra</h3>
    <input id="fEn" placeholder="Palabra en inglés" required>
    <input id="fPh" placeholder="Cómo se pronuncia (ej: skéchul)" required>
    <input id="fEs" placeholder="Significado en español" required>
    <div class="two">
      <select id="fType" aria-label="Tipo">
        <option value="work">Trabajo</option><option value="daily">Día a día</option>
        <option value="legal">Legal</option><option value="jur">Inglés jurídico</option><option value="trap">Trampas</option>
      </select>
      <select id="fDif" aria-label="Dificultad">
        <option value="f">Fácil</option><option value="d">Difícil</option><option value="m">Muy difícil</option>
      </select>
    </div>
    <input id="fCat" placeholder="Categoría (ej: Reuniones y agenda)">
    <input id="fEx" placeholder="Frase de ejemplo (opcional)">
    <textarea id="fNote" rows="2" placeholder="Nota (opcional)"></textarea>
    <div class="err" id="fErr"></div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="fCancel">Cancelar</button>
      <button type="button" class="btn primary" id="fSave">Guardar palabra</button>
    </div>
  </form>
</dialog>

tag": "id", "bi": "ˌɪnˈvɛstəˌɡeɪt", "pi": "ˌɪnˈvɛstəˌɡeɪtəd", "pti": "ˌɪnˈvɛstəˌɡeɪtəd", "gi": "ˌɪnˈvɛstəˌɡeɪtɪŋ"}, {"c": "Legal", "b": "interview", "bf": "ínterviu", "p": "interviewed", "pf": "ínterviud", "pt": "interviewed", "ptf": "ínterviud", "g": "interviewing", "gf": "ínterviuing", "es": "Entrevistar", "ex": "We interviewed the witnesses.", "tag": "d", "bi": "ˈɪntɚˌvju", "pi": "ˈɪntɚˌvjud", "pti": "ˈɪntɚˌvjud", "gi": "ˈɪntɚˌvjuɪŋ"}, {"c": "Legal", "b": "award", "bf": "auórd", "p": "awarded", "pf": "auórdid", "pt": "awarded", "ptf": "auórdid", "g": "awarding", "gf": "auórding", "es": "Otorgar", "ex": "The court awarded damages.", "tag": "id", "bi": "əˈwɔrd", "pi": "əˈwɔrdɪd", "pti": "əˈwɔrdɪd", "gi": "əˈwɔrdɪŋ"}, {"c": "Legal", "b": "waive", "bf": "uéiv", "p": "waived", "pf": "uéivd", "pt": "waived", "ptf": "uéivd", "g": "waiving", "gf": "uéiving", "es": "Renunciar (a un derecho)", "ex": "He waived his right to appeal.", "tag": "d", "bi": "weɪv", "pi": "weɪvd", "pti": "weɪvd", "gi": "ˈweɪvɪŋ"}, {"c": "Legal", "b": "grant", "bf": "grant", "p": "granted", "pf": "grántid", "pt": "granted", "ptf": "grántid", "g": "granting", "gf": "gránting", "es": "Conceder", "ex": "The motion was granted.", "tag": "id", "bi": "ɡrænt", "pi": "ˈɡræntəd", "pti": "ˈɡræntəd", "gi": "ˈɡræntɪŋ"}, {"c": "Legal", "b": "overturn", "bf": "ouvertérn", "p": "overturned", "pf": "ouvertérnd", "pt": "overturned", "ptf": "ouvertérnd", "g": "overturning", "gf": "ouvertérning", "es": "Revocar", "ex": "The ruling was overturned.", "tag": "d", "bi": "ˈoʊvɚˌtɝn", "pi": "ˈoʊvɚˌtɝnd", "pti": "ˈoʊvɚˌtɝnd", "gi": "ˈoʊvɚˌtɝnɪŋ"}, {"c": "Legal", "b": "sentence", "bf": "séntens", "p": "sentenced", "pf": "séntenst", "pt": "sentenced", "ptf": "séntenst", "g": "sentencing", "gf": "séntensing", "es": "Condenar (a una pena)", "ex": "He was sentenced to two years.", "tag": "t", "bi": "ˈsɛntəns", "pi": "ˈsɛntənst", "pti": "ˈsɛntənst", "gi": "ˈsɛntənsɪŋ"}, {"c": "Legal", "b": "indemnify", "bf": "indémnifai", "p": "indemnified", "pf": "indémnifaid", "pt": "indemnified", "ptf": "indémnifaid", "g": "indemnifying", "gf": "indémnifaiing", "es": "Indemnizar", "ex": "The employer indemnified the worker.", "tag": "d", "bi": "ˌɪnˈdɛmnəˌfaɪ", "pi": "ˌɪnˈdɛmnəˌfaɪd", "pti": "ˌɪnˈdɛmnəˌfaɪd", "gi": "ˌɪnˌdɛmnɪˈfaɪɪŋ"}], "concepts": [{"en": "Elements of a contract", "f": "élements ov a cóntract", "es": "Elementos del contrato", "cat": "Formación del contrato", "body": ["En el derecho de EE.UU. un contrato exigible requiere cuatro elementos: un acuerdo (agreement), formado por una oferta (offer) y una aceptación (acceptance); una contraprestación (consideration); capacidad (capacity) de las partes; y licitud (legality) del objeto.", "A esto se suman dos defensas frecuentes: que el consentimiento no haya sido genuino (genuineness of assent) y que el contrato no cumpla la forma exigida (Statute of Frauds).", "La diferencia principal con el derecho chileno es la consideration: en EE.UU. una promesa gratuita, sin nada a cambio, por regla general no es exigible."], "i": "ˈɛləmənts ʌv ə ˈkɑnˌtrækt"}, {"en": "Requirements of the offer", "f": "rikuáierments ov di ófer", "es": "Requisitos de la oferta", "cat": "Formación del contrato", "body": ["Una oferta es una promesa o compromiso (commitment) de hacer o abstenerse de hacer (refrain) algo en el futuro. Tiene tres requisitos:", "Intención (intention): el oferente debe querer obligarse. Una frase dicha por enojo o en broma no es oferta, porque falta la intención de quedar obligado (intent to be bound).", "Determinación (definiteness): los términos esenciales (material terms), como precio, cantidad y objeto, deben ser razonablemente precisos. Una promesa de bono \"si la gerencia lo estima justificado\" carece de definiteness.", "Comunicación (communication): el destinatario (offeree) debe conocer la oferta. Quien devuelve un perro perdido sin saber de la recompensa no puede exigirla."], "i": "rɪˈkwaɪrmənts ʌv ðə ˈɔfɚ"}, {"en": "Termination of the offer", "f": "terminéishen ov di ófer", "es": "Extinción de la oferta", "cat": "Formación del contrato", "body": ["Por actos de las partes (termination by action of the parties): (1) revocación (revocation) del oferente, que produce efecto cuando el destinatario la recibe; si la oferta se hizo al público, se revoca por el mismo medio; (2) rechazo (rejection) del destinatario, eficaz al recibirse (preguntar por la oferta no es rechazarla); y (3) contraoferta (counteroffer), que rechaza la oferta original y crea una nueva.", "Por el solo ministerio de la ley (termination by operation of law): (1) transcurso del plazo (lapse of time) o, si no hay plazo, de un tiempo razonable; (2) destrucción del objeto (destruction of the subject matter); (3) muerte o incapacidad (death or incompetence) del oferente o del destinatario; y (4) ilicitud sobreviniente (supervening illegality)."], "i": "tɚməˈneɪʃən ʌv ðə ˈɔfɚ"}, {"en": "Irrevocable offers: firm offer and option contract", "f": "irrévocabol ófers", "es": "Ofertas irrevocables", "cat": "Formación del contrato", "body": ["Por regla general, el oferente puede revocar la oferta aunque haya prometido mantenerla, porque esa promesa no tiene consideration. Hay tres excepciones:", "Contrato de opción (option contract): el destinatario paga algo (aunque sea poco) para que la oferta se mantenga abierta por un plazo. Si no hay plazo, se entiende uno razonable.", "Oferta en firme del comerciante (merchant's firm offer, UCC 2-205): la oferta escrita y firmada por un comerciante que asegura mantenerse abierta es irrevocable aun sin consideration, por el plazo indicado o uno razonable, con un máximo de tres meses.", "Promissory estoppel: si el destinatario cambió su posición confiando justificadamente en la oferta (justifiable reliance), el oferente no puede revocarla."], "i": "ˌɪˈrɛvəkəbəl ˈɔfɚz fɝm ˈɔfɚ ænd ˈɑpʃən ˈkɑnˌtrækt"}, {"en": "Mirror image rule and battle of the forms", "f": "míror ímich rul", "es": "Regla de la imagen en espejo y batalla de formularios", "cat": "Formación del contrato", "body": ["Mirror image rule (common law): la aceptación debe coincidir exactamente con la oferta. Si el destinatario agrega o cambia términos, no acepta: hace una contraoferta, y la oferta original se extingue. Equivale a la aceptación \"pura y simple\" del derecho chileno.", "Battle of the forms (UCC 2-207): en la compraventa de mercaderías, las empresas intercambian formularios distintos (orden de compra y confirmación). El UCC suaviza la regla: una aceptación definitiva forma contrato aunque agregue términos. Entre comerciantes, esos términos adicionales pasan a formar parte del contrato, salvo que alteren sustancialmente el acuerdo (por ejemplo, excluir la garantía de comerciabilidad), que la oferta los prohíba o que la otra parte objete.", "Si la aceptación se condiciona expresamente a que el otro acepte los nuevos términos, no hay contrato por los formularios; pero si las partes igual cumplen (se envía y se usa la mercadería), hay contrato por conducta con los términos en que ambos coinciden."], "i": "ˈmɪrɚ ˈɪmədʒ rul ænd ˈbætəl ʌv ðə fɔrmz"}, {"en": "Silence as acceptance", "f": "sáilens as akséptans", "es": "El silencio como aceptación", "cat": "Formación del contrato", "body": ["Por regla general, el silencio no es aceptación. Excepcionalmente lo es cuando: (1) el destinatario recibe el beneficio de servicios ofrecidos, pudiendo rechazarlos y sabiendo que se esperaba pago (receipt of offered services); o (2) las relaciones previas entre las partes (prior dealings) hacen razonable entender que el silencio significa aceptación.", "Ejemplo del curso: la aseguradora que por años envió renovación y cuenta, y el asegurado retuvo la póliza sin pagar: debe las primas del período en que estuvo cubierto."], "chile": "En Chile el silencio, por regla general, tampoco es manifestación de voluntad. Tiene valor cuando la ley, las partes o las circunstancias se lo dan (silencio circunstanciado), por ejemplo en relaciones comerciales habituales.", "i": "ˈsaɪləns æz ækˈsɛptəns"}, {"en": "Mailbox rule", "f": "méilbox rul", "es": "Regla del buzón", "cat": "Formación del contrato", "body": ["Si el destinatario usa un medio de comunicación autorizado expresa o tácitamente por el oferente, la aceptación produce efecto al enviarse (on dispatch), aunque nunca llegue. Si el oferente no indicó medio, puede usarse el mismo que él usó u otro más rápido.", "Excepciones: si la aceptación no se envió correctamente, en la mayoría de los estados produce efecto solo al recibirse; si el oferente condicionó la oferta a recibir la aceptación en una fecha, solo vale si llega a tiempo; si se envían rechazo y aceptación, vale el que llega primero; y si se usa un medio no autorizado, la aceptación produce efecto al recibirse."], "chile": "En Chile, el Código de Comercio sigue la teoría de la declaración: el contrato se perfecciona cuando se da la aceptación pura y simple (art. 101). La oferta verbal debe aceptarse en el acto (art. 97) y la escrita dentro de 24 horas si las partes residen en el mismo lugar, o \"a vuelta de correo\" si residen en lugares distintos (art. 98).", "i": "ˈmeɪlˌbɑks rul"}, {"en": "Consideration", "f": "consideréishen", "es": "Contraprestación", "cat": "Consideration y validez", "body": ["Consideration es el valor que se da a cambio de una promesa. Tiene dos elementos: (1) algo de valor jurídico (legal value): una promesa, un acto o una abstención (forbearance) que la persona no estaba obligada a realizar; y (2) un intercambio negociado (bargained-for exchange): se entrega precisamente a cambio de la promesa.", "Suficiencia jurídica (legal sufficiency): lo entregado debe ser un perjuicio jurídico para quien lo da (legal detriment) o un beneficio jurídico para quien promete. Una donación (gift) normalmente no es consideration.", "Equivalencia (adequacy): los tribunales normalmente no revisan si el trato fue justo. Una desproporción extrema solo es relevante como indicio de fraude, fuerza, incapacidad, influencia indebida o de que no hubo verdadero intercambio, o si el contrato es abusivo (unconscionable). Por eso no existe una regla equivalente a la lesión enorme chilena."], "i": "kənˌsɪdəˈreɪʃən"}, {"en": "Contracts that lack consideration", "f": "cóntracts dat lak consideréishen", "es": "Contratos sin contraprestación", "cat": "Consideration y validez", "body": ["Deber preexistente (preexisting duty): prometer hacer lo que uno ya estaba obligado a hacer no es consideration. Si un arquitecto exige el doble para terminar un trabajo ya pactado, la promesa de pagar más no es exigible. Excepciones: dificultades imprevistas extraordinarias (unforeseen difficulties), no simples riesgos del negocio; y la rescisión del contrato anterior seguida de uno nuevo. En la compraventa de mercaderías, el UCC permite modificar el contrato sin nueva consideration si se hace de buena fe.", "Contraprestación pasada (past consideration): un acto ya realizado no puede ser consideration de una promesa posterior. Ejemplo: la pensión prometida a una trabajadora después de que ya se jubiló.", "Promesa ilusoria (illusory promise): si quien promete se reserva la libertad total de cumplir o no (\"pagaré lo que estime que vale\", \"puedo terminar en cualquier momento sin aviso\"), en realidad no prometió nada y el contrato no es exigible."], "i": "ˈkɑnˌtrækts ðæt læk kənˌsɪdəˈreɪʃən"}, {"en": "Promissory estoppel", "f": "prómisori estópel", "es": "Promissory estoppel (confianza en una promesa)", "cat": "Consideration y validez", "body": ["Permite exigir una promesa aunque no haya consideration (también llamada detrimental reliance). Requisitos: (1) la promesa fue clara y definida; (2) el beneficiario confió en ella de forma justificada; (3) esa confianza fue sustancial y lo llevó a cambiar su conducta en perjuicio propio; (4) la confianza era previsible para quien prometió; y (5) solo se evita una injusticia haciendo cumplir la promesa (equidad).", "Ejemplo del curso: el abuelo que promete transferir un terreno si el nieto construye una casa y vive allí dos años. El nieto gastó dinero confiando en la promesa, por lo que puede exigirla.", "También sirve como excepción al Statute of Frauds: un contrato verbal puede hacerse cumplir si se cumplen estos requisitos."], "chile": "La idea se parece a la doctrina de los actos propios del derecho chileno: nadie puede contradecir su conducta anterior en perjuicio de quien confió en ella. Pero no son equivalentes: en Chile no se usa para dar fuerza obligatoria a promesas gratuitas.", "i": "ˈprɑməˌsɔri ɛˈstɑpəl"}, {"en": "Unconscionability", "f": "ankonshenabíliti", "es": "Contratos abusivos", "cat": "Licitud y orden público", "body": ["Un contrato o cláusula es unconscionable cuando es tan desequilibrado que \"escandaliza la conciencia\" del tribunal. El tribunal puede negarse a hacerlo cumplir, total o parcialmente.", "Abusividad procedimental (procedural unconscionability): se refiere a cómo se celebró el contrato: letra chica, jerga jurídica (legalese), falta de negociación o una parte con poca capacidad de entender. Los contratos de adhesión (adhesion contracts) son el caso típico.", "Abusividad sustantiva (substantive unconscionability): se refiere al contenido: términos excesivamente favorables para una parte, como precios desmedidos o renuncias a todo remedio. Normalmente los tribunales exigen ambas formas en algún grado."], "i": "ʌnˌkɑnʃənəˈbɪləti"}, {"en": "Contracts contrary to statute", "f": "cóntracts cóntrari tu stáchut", "es": "Contratos contrarios a la ley", "cat": "Licitud y orden público", "body": ["Usura (usury): todos los estados limitan la tasa de interés. Las consecuencias varían: en muchos estados el tribunal no hace cumplir el exceso de interés, pero el préstamo sigue siendo válido.", "Juegos de azar (gambling): todos los estados los regulan; los contratos de apuesta ilegal no son exigibles.", "Leyes dominicales (Sabbath laws): en algunos estados se prohíben ciertos contratos en domingo, con excepciones para bienes de primera necesidad y obras de caridad.", "Leyes de habilitación profesional (licensing statutes): si la ley busca proteger al público de personas no calificadas (por ejemplo, abogados o médicos), el contrato con quien no tiene licencia es ilícito y no exigible. Si la ley solo busca recaudar (raise revenue), el contrato sí es exigible."], "chile": "En Chile la Ley 18.010 fija el interés máximo convencional en el interés corriente aumentado en un 50%. Si se pacta un interés mayor, la sanción es que el interés se reduce al interés corriente (art. 8). La usura además es delito (art. 472 del Código Penal).", "i": "ˈkɑnˌtrækts ˈkɑntrɛri tu ˈstætʃut"}, {"en": "Covenant not to compete", "f": "cávenant not tu compít", "es": "Pacto de no competencia", "cat": "Licitud y orden público", "body": ["Como la ley favorece la libre competencia, los contratos que restringen el comercio (restraint of trade) o infringen las leyes antimonopolio (antitrust) están prohibidos. Sin embargo, el pacto de no competencia es válido si es accesorio a una venta de empresa o a un contrato de trabajo y es razonable en tiempo y en territorio, protegiendo un interés legítimo (clientes, información).", "Si es excesivo, algunos tribunales lo reforman (reformation) para dejarlo en límites razonables; otros lo anulan completo. En los casos del curso, prohibir competir \"para siempre\" o en todas las ciudades donde la empresa tiene oficinas es irrazonable; prohibir atender por dos años a los mismos clientes que el trabajador atendió suele ser razonable."], "chile": "En Chile no hay una regla general en el Código del Trabajo sobre pactos de no competencia posteriores al término del contrato. La jurisprudencia los revisa a la luz de la libertad de trabajo (art. 19 N° 16 de la Constitución) y suele exigir límites razonables de tiempo, territorio y materia, además de una compensación para el trabajador.", "i": "ˈkʌvənənt nɑt tu kəmˈpit"}, {"en": "Exculpatory clauses", "f": "ekskálpatori clózis", "es": "Cláusulas de exoneración de responsabilidad", "cat": "Licitud y orden público", "body": ["Son cláusulas que buscan liberar a una parte de responsabilidad por su propia negligencia u otros ilícitos. Por regla general se consideran contrarias al orden público, sobre todo en servicios al público. Ejemplo del curso: la aerolínea que imprime en el pasaje que no responde por accidentes causados por su negligencia no puede invocar esa cláusula.", "Las cláusulas que eximen de responsabilidad por dolo o culpa grave casi nunca son válidas."], "chile": "En Chile, la condonación del dolo futuro no vale (art. 1465 del Código Civil) y la culpa grave se equipara al dolo en materia civil (art. 44). En contratos de consumo, la Ley 19.496 declara sin efecto las cláusulas que limitan absolutamente la responsabilidad del proveedor (art. 16).", "i": "ˌɛkˈskʌlpəˌtɔri ˈklɔzəz"}, {"en": "Effect of illegality", "f": "iféct ov iligáliti", "es": "Efecto de la ilicitud", "cat": "Licitud y orden público", "body": ["Regla general: el contrato ilícito es nulo (void). Ninguna parte puede demandar su cumplimiento ni indemnización por incumplimiento. El tribunal deja a las partes donde están.", "Excepciones: (1) ignorancia justificada de los hechos (justifiable ignorance): la parte inocente que no conocía los hechos que hacían ilícito el contrato puede recuperar lo entregado (no aplica a quien ignora la ley); (2) miembros de un grupo protegido (protected class): si la ley protege a cierto grupo, ese protegido puede exigir el contrato, pero la otra parte no; (3) retiro oportuno (withdrawal): si la parte ilícita aún no se ha cumplido, se puede desistir y recuperar lo dado; y (4) fraude, fuerza o influencia indebida: quien fue inducido a un contrato ilícito por esos medios puede recuperar lo entregado."], "chile": "En Chile, el objeto o causa ilícita produce nulidad absoluta (arts. 1682 y 1683 del Código Civil). No puede repetirse lo que se haya dado o pagado por un objeto o causa ilícita a sabiendas (art. 1468), regla parecida a la excepción de ignorancia justificada.", "i": "ɪˈfɛkt ʌv ˌɪliˈɡælɪti"}, {"en": "Void and voidable contracts", "f": "void and vóidabol cóntracts", "es": "Contratos nulos y anulables", "cat": "Licitud y orden público", "body": ["Void (nulo): el contrato no produce ningún efecto; ninguna parte puede exigirlo. Ejemplo: un contrato con objeto ilícito.", "Voidable (anulable): el contrato es válido, pero una parte (la perjudicada, engañada o incapaz) puede elegir dejarlo sin efecto (disaffirm o rescind) o mantenerlo. Si lo confirma, expresa o tácitamente, se produce la ratificación (ratification) y el contrato queda plenamente exigible.", "Unenforceable (inexigible): el contrato existe, pero no puede hacerse cumplir en juicio, por ejemplo por falta de escrito exigido por el Statute of Frauds."], "chile": "La distinción se acerca a la nulidad absoluta (void) y la nulidad relativa (voidable) del Código Civil. La nulidad relativa puede sanearse por ratificación (art. 1684).", "i": "vɔɪd ænd ˈvɔɪdəbəl ˈkɑnˌtrækts"}, {"en": "Mistakes", "f": "mistéiks", "es": "El error", "cat": "Vicios del consentimiento", "body": ["Error unilateral (unilateral mistake): si solo una parte se equivoca sobre un hecho esencial (material fact), por regla general no tiene derecho a liberarse del contrato. Excepciones: (1) la otra parte sabía o debía saber del error, como una oferta de $90 cuando las demás son de $600 y $800; y (2) error aritmético involuntario (inadvertent mathematical mistake). Un error de juicio o de cálculo de negocio, en cambio, no libera.", "Error común sobre un hecho esencial (mutual mistake of material fact): si ambas partes se equivocan sobre un hecho esencial, cualquiera puede dejar sin efecto el contrato.", "Error común sobre el valor (mutual mistake in value): si ambas partes se equivocan sobre el valor de mercado o la calidad, el contrato se mantiene. Ejemplo del curso: la gansa que empieza a poner huevos de oro."], "chile": "En Chile el error como vicio del consentimiento se regula en los arts. 1451 a 1455 del Código Civil: error esencial u obstáculo, error sustancial sobre la calidad esencial del objeto, error accidental (solo si fue el motivo principal y la otra parte lo sabía) y error en la persona (solo si la persona fue la causa principal del contrato).", "i": "mɪˈsteɪks"}, {"en": "Fraudulent misrepresentation", "f": "fróchulent misreprezentéishen", "es": "Fraude (declaración falsa)", "cat": "Vicios del consentimiento", "body": ["Elementos: (1) declaración falsa de un hecho esencial (misrepresentation of a material fact); (2) intención de engañar (intent to deceive); y (3) confianza justificada de la víctima (justifiable reliance). Para obtener indemnización se exige además un perjuicio (injury); para dejar sin efecto el contrato, la mayoría de los tribunales no lo exige.", "La declaración puede hacerse por palabras o por conducta, por ejemplo ocultando un defecto (concealment). Las opiniones normalmente no son fraude, salvo cuando un comprador ingenuo confía en la opinión de un experto. El error sobre la ley no da derecho a remedio, salvo que quien lo causó sea un profesional del derecho. El silencio solo es fraude si se oculta un defecto grave que la otra parte no podía razonablemente sospechar.", "Hay intención de engañar si se sabe que lo dicho es falso, si se afirma algo con temeridad (recklessly) sin importar si es cierto, o si se aparenta un conocimiento personal que no se tiene."], "chile": "En Chile corresponde al dolo (arts. 1458 y 1459 del Código Civil). En los contratos bilaterales, solo vicia el consentimiento si es obra de una de las partes y si sin él no se habría contratado (dolo determinante). El dolo no se presume: debe probarse.", "i": "ˈfrɔdʒələnt mɪsˌrɛprɪzɛnˈteɪʃən"}, {"en": "Undue influence and duress", "f": "andiú ínfluens and diurés", "es": "Influencia indebida y fuerza", "cat": "Vicios del consentimiento", "body": ["Influencia indebida (undue influence): una parte domina a la otra por una relación de confianza o dependencia (abogado y cliente, cuidador y adulto mayor) y obtiene un contrato que la enriquece. La víctima no ejerció su libre voluntad y el contrato es anulable (voidable).", "Fuerza (duress): una parte obliga a la otra a contratar amenazándola con un acto ilícito, como violencia o un daño a un ser querido. La necesidad económica por sí sola no basta. Amenazar con ejercer un derecho legítimo, por ejemplo demandar por una deuda real, tampoco es fuerza.", "El contrato celebrado bajo fuerza es anulable; si la fuerza es física extrema, puede no haber consentimiento alguno."], "chile": "En Chile, la fuerza vicia el consentimiento si es grave, injusta y determinante (arts. 1456 y 1457 del Código Civil). El \"temor reverencial\" (el solo temor de desagradar a quien se debe respeto) no basta para viciar el consentimiento.", "i": "ənˈdu ˈɪnfluəns ænd ˈdʊrɛs"}, {"en": "Statute of Frauds", "f": "stáchut ov frods", "es": "Contratos que deben constar por escrito", "cat": "Forma del contrato", "body": ["El Statute of Frauds exige que ciertos contratos consten por escrito para ser exigibles. Si no constan, el contrato no es nulo: la falta de escrito es una defensa contra su cumplimiento.", "Deben constar por escrito: (1) contratos sobre derechos en inmuebles (interests in land), incluidos los arriendos largos; (2) contratos que es objetivamente imposible cumplir dentro de un año desde su celebración (one-year rule); si es posible cumplirlos en un año, aunque sea improbable, no necesitan escrito; (3) promesas de pagar la deuda de otro (collateral promises), salvo que el garante busque principalmente un beneficio propio (main purpose rule); (4) promesas en consideración al matrimonio, como los acuerdos prenupciales; y (5) compraventas de mercaderías por US$500 o más (UCC 2-201)."], "chile": "En Chile, la regla es la consensualidad, pero algunos contratos son solemnes: por ejemplo, la compraventa de inmuebles debe celebrarse por escritura pública (art. 1801 del Código Civil). Además, no se admite prueba de testigos para acreditar obligaciones que valgan más de dos unidades tributarias que debieron constar por escrito (arts. 1708 y 1709). El contrato de trabajo es consensual, pero debe escriturarse, y la falta de escrito hace presumir que son estipulaciones del contrato las que declare el trabajador (art. 9 del Código del Trabajo).", "i": "ˈstætʃut ʌv frɔdz"}, {"en": "Exceptions to the Statute of Frauds", "f": "eksépshens tu de stáchut ov frods", "es": "Excepciones a la exigencia de escrito", "cat": "Forma del contrato", "body": ["Cumplimiento parcial (partial performance): en inmuebles, si el comprador pagó parte del precio, tomó posesión e hizo mejoras permanentes, el tribunal puede ordenar el cumplimiento forzado. Bajo el UCC, el contrato verbal es exigible en la medida en que se aceptó el pago o la entrega de las mercaderías.", "Reconocimiento (admission): si la parte reconoce en sus escritos (pleadings), en su declaración o ante el tribunal que celebró el contrato, este es exigible (en el UCC, hasta la cantidad reconocida).", "Promissory estoppel: si hubo confianza justificada y previsible en la promesa verbal y solo así se evita una injusticia.", "Excepciones especiales del UCC: mercaderías hechas a medida (customized goods) cuando el vendedor ya comenzó a fabricarlas; y contratos entre comerciantes confirmados por escrito, si quien recibió la confirmación no la objetó dentro de 10 días."], "i": "ɪkˈsɛpʃənz tu ðə ˈstætʃut ʌv frɔdz"}, {"en": "Sufficiency of a writing", "f": "safíshensi ov a ráiting", "es": "Qué debe contener el escrito", "cat": "Forma del contrato", "body": ["No se requiere un contrato formal: basta un memo, confirmación, factura, boleta, cheque, fax o varios documentos relacionados entre sí.", "Debe estar firmado por la parte a quien se le exige el cumplimiento (party to be charged); basta una firma o iniciales en cualquier parte del documento.", "Bajo el UCC, el escrito debe indicar la cantidad (quantity term); los demás términos pueden faltar. En los demás contratos, debe identificar a las partes, el objeto, la contraprestación y la cantidad; en la venta de inmuebles, algunos estados exigen además precio y descripción del bien."], "i": "səˈfɪʃənsi ʌv ə ˈraɪtɪŋ"}, {"en": "Parol evidence rule", "f": "paróul évidens rul", "es": "Regla de exclusión de la prueba de acuerdos previos", "cat": "Prueba e interpretación", "body": ["Si el contrato escrito está integrado (integrated), es decir, es la expresión final de lo acordado, no se admite prueba de negociaciones previas, acuerdos anteriores ni acuerdos verbales simultáneos que contradigan o modifiquen lo escrito. La cláusula de acuerdo íntegro (merger clause) refuerza esa integración.", "Excepciones: sí se admite prueba para (1) acreditar una modificación posterior; (2) demostrar que el contrato es nulo o anulable, por ejemplo por fraude; (3) explicar términos ambiguos; (4) completar un término esencial que falta; (5) bajo el UCC, mostrar relaciones previas (prior dealings) o usos del comercio (usage of trade); (6) probar una condición verbal de la que dependía la eficacia del contrato; y (7) corregir un error de transcripción evidente.", "Ejemplo del curso: si el banco prometió verbalmente 90 días de gracia, pero el pagaré firmado dice que puede demandar sin plazo alguno, la promesa verbal no puede probarse."], "i": "pəˈroʊl ˈɛvədəns rul"}, {"en": "Remedies for breach", "f": "rémedis for brich", "es": "Remedios ante el incumplimiento", "cat": "Incumplimiento y remedios", "body": ["Indemnización (damages): es el remedio principal. Los daños compensatorios (compensatory damages) cubren la pérdida directa; los consecuenciales (consequential damages) cubren pérdidas indirectas previsibles al contratar, como el negocio perdido por recibir piezas defectuosas. Los daños punitivos casi nunca proceden por simple incumplimiento contractual.", "Cumplimiento forzado (specific performance): el tribunal ordena cumplir en naturaleza. Es excepcional y procede cuando la indemnización no basta, típicamente en inmuebles o bienes únicos; nunca para obligar a una persona a prestar servicios personales.", "Restitución (restitution): devolver lo recibido para evitar un enriquecimiento injusto. Rescisión (rescission): dejar sin efecto el contrato. Reforma (reformation): el tribunal corrige el contrato para reflejar lo que las partes realmente acordaron. Orden judicial (injunction): ordena hacer o no hacer algo, por ejemplo respetar un pacto de no competencia."], "chile": "En Chile, ante el incumplimiento de un contrato bilateral, el acreedor puede pedir el cumplimiento forzado o la resolución, en ambos casos con indemnización de perjuicios (art. 1489 del Código Civil). El cumplimiento forzado es la regla, no la excepción.", "i": "ˈrɛmədiz fɔr britʃ"}, {"en": "Material breach and anticipatory repudiation", "f": "matírial brich", "es": "Incumplimiento esencial y repudio anticipado", "cat": "Incumplimiento y remedios", "body": ["Incumplimiento esencial (material breach): afecta lo esencial del contrato y permite a la otra parte suspender su propio cumplimiento, terminar el contrato y demandar indemnización.", "Incumplimiento no esencial (immaterial breach): la otra parte debe seguir cumpliendo y solo puede pedir indemnización por la diferencia.", "Repudio anticipado (anticipatory repudiation): una parte declara o demuestra claramente, antes de la fecha de cumplimiento, que no cumplirá. La otra parte puede tratarlo de inmediato como incumplimiento y demandar."], "i": "məˈtɪriəl britʃ ænd ænˈtɪsəpəˌtɔri rɪˌpjudiˈeɪʃən"}, {"en": "Common law and the U.S. court system", "f": "cómon lo", "es": "El common law y el sistema de tribunales de EE.UU.", "cat": "Sistema jurídico", "body": ["En el common law, las sentencias de los jueces crean derecho (judge-made law) y son precedentes obligatorios (binding precedents) para los tribunales inferiores. Las leyes escritas aprobadas por el Congreso o las legislaturas se llaman statutes.", "EE.UU. tiene un sistema federal: 50 sistemas estatales, el sistema federal y el del Distrito de Columbia. Cada uno tiene tres niveles: tribunal de primera instancia (trial court), corte de apelaciones (court of appeals) y corte suprema (supreme court). Las decisiones de cada nivel obligan a los tribunales inferiores de su mismo sistema.", "El Uniform Commercial Code (UCC) es una ley modelo adoptada, total o parcialmente, por casi todos los estados. Rige la compraventa de mercaderías; los demás contratos se rigen por el common law."], "i": "ˈkɑmən lɔ ænd ðə juz kɔrt ˈsɪstəm"}, {"en": "Agency and power of attorney", "f": "éichensi and páuer ov atérni", "es": "Representación y poder", "cat": "Sistema jurídico", "body": ["La relación de representación (agency) existe cuando una persona, el representante (agent), actúa por cuenta de otra, el mandante (principal). Los actos del agente dentro de sus facultades obligan al principal; por ejemplo, la aceptación hecha por el agente del destinatario es válida.", "El poder (power of attorney) es el documento por el cual el principal otorga facultades al agente. El agente no necesita ser abogado: \"attorney\" aquí significa representante.", "Distinción útil: attorney es el abogado que ejerce; lawyer es quien estudió derecho, ejerza o no. El District Attorney es el fiscal."], "i": "ˈeɪdʒənsi ænd ˈpaʊɚ ʌv əˈtɝni"}], "chart": [{"g": "Vocales", "sym": "i", "es": "i (larga)", "lv": "parecido", "ex": "Como la \"i\" española, pero más larga y tensa, con los labios estirados como en una sonrisa.", "w": [{"w": "see", "i": "si"}, {"w": "leave", "i": "liv"}, {"w": "deed", "i": "did"}, {"w": "plea", "i": "pli"}]}, {"g": "Vocales", "sym": "ɪ", "es": "i (corta)", "lv": "nuevo", "ex": "Entre la \"i\" y la \"e\" españolas: breve y relajada. No existe en español y es la causa de confundir ship/sheep o live/leave.", "w": [{"w": "sit", "i": "sɪt"}, {"w": "live", "i" const K_CUSTOM='pron_v2_custom', K_HIDDEN='pron_v2_hidden', K_MIG='pron_v2_migrated';
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let custom=load(K_CUSTOM,[]), hidden=new Set(load(K_HIDDEN,[]));

const TYPES={work:'Trabajo',daily:'Día a día',legal:'Legal',jur:'Inglés jurídico',trap:'Trampas',verbs:'Verbos'};

const baseWords=DATA.words.map(w=>({...w,id:w.t+':'+w.en.toLowerCase()}));
const baseVerbs=DATA.verbs.map(v=>({...v,t:'verbs',id:'verbs:'+v.b}));

/* migra palabras agregadas en la versión anterior */
(function migrate(){
  if(load(K_MIG,false))return;
  const old=load('englishWords',null);
  if(Array.isArray(old)){
    const known=new Set([...baseWords.map(w=>w.en.toLowerCase()),...baseVerbs.map(v=>v.b),...baseVerbs.map(v=>'to '+v.b)]);
    const extra=old.filter(o=>o&&o.en&&!known.has(String(o.en).toLowerCase().replace(/\s*\(.*\)\s*/,'').trim())&&!known.has(String(o.en).toLowerCase()));
    extra.forEach(o=>custom.push({t:o.type==='complex'?'trap':(TYPES[o.type]&&o.type!=='verbs'?o.type:'daily'),c:o.category||'Mis palabras',en:o.en,f:o.phonetic||'',es:o.spanish||'',d:o.difficulty==='difícil'?'d':(o.difficulty==='muy difícil'?'m':'f'),ex:'',n:o.note||'',id:'c:'+Date.now()+Math.random()}));
    save(K_CUSTOM,custom);
  }
  save(K_MIG,true);
})();

function allItems(){
  return [...baseWords,...baseVerbs,...custom].filter(i=>!hidden.has(i.id));
}

const TTS={ok:typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined',voice:null,slow:load('pron_v2_slow',false)};
function pickVoice(){
  if(!TTS.ok)return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  const pref=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Guy','Ava','Allison','Alex','Microsoft Zira','Microsoft David'];
  TTS.voice=pref.map(p=>vs.find(v=>v.name.includes(p))).find(Boolean)||vs.find(v=>v.localService)||vs[0]||null;
}
if(TTS.ok){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){speechSynthesis.onvoiceschanged=pickVoice}}
let curUtt=null,toastTimer=null;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=msg;el.className=msg?'show':'';
  clearTimeout(toastTimer);if(msg)toastTimer=setTimeout(()=>{el.className=''},5000);
}
function speak(text){
  if(!TTS.ok){toast('Este navegador no permite reproducir audio. Abre la página en Safari o Chrome.');return}
  const s=window.speechSynthesis;
  if(!TTS.voice)pickVoice();
  try{if(s.speaking||s.pending)s.cancel()}catch(e){}
  try{s.resume()}catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';if(TTS.voice)u.voice=TTS.voice;u.rate=TTS.slow?0.65:0.95;u.volume=1;u.pitch=1;
  let started=false;
  u.onstart=()=>{started=true;toast('')};
  u.onerror=e=>{if(e&&e.error!=='interrupted'&&e.error!=='canceled')toast('No se pudo reproducir el audio ('+(e.error||'error')+'). Revisa el volumen y que el teléfono no esté en silencio.')};
  curUtt=u;
  s.speak(u);
  setTimeout(()=>{if(!started&&!s.speaking)toast('El audio no comenzó. Revisa que el teléfono no esté en modo silencio y que el volumen esté alto. Si abriste la página dentro de la app de Claude, ábrela en Safari.')},2500);
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- conjugación ---------- */
const P={I:'ái',She:'shi',you:'iu',They:'déi',It:'it',do:'du',Do:'du',does:'das',"doesn't":'dásent',Did:'did',"didn't":'dídent',will:'uil',"won't":'uóunt',"I'm going to":'áim góuing tu',am:'am',is:'is',are:'ar',was:'uós',were:'uer',have:'jav',has:'jas',had:'jad',would:'uúd',Are:'ar',Were:'uer',not:'not',"I'm":'áim'};
const S_OVR={have:['has','jas'],do:['does','das'],go:['goes','góus'],say:['says','sez']};
function sForm(v){
  if(S_OVR[v.b])return S_OVR[v.b];
  const b=v.b;let sp,ph;
  if(/(s|sh|ch|x|z|o)$/.test(b))sp=b+'es';else if(/[^aeiou]y$/.test(b))sp=b.slice(0,-1)+'ies';else sp=b+'s';
  ph=/(s|sh|ch|x|z|ce|ge|se|dge)$/.test(b)?v.bf+'is':v.bf+'s';
  return [sp,ph];
}
function line(parts){ // parts: [[texto, fonética, esAux]]
  const en=parts.map(p=>p[2]?`<b class="aux">${esc(p[0])}</b>`:esc(p[0])).join(' ');
  const ph=parts.map(p=>p[1]).join(' ');
  const plain=parts.map(p=>p[0]).join(' ');
  return `<div class="tline">${sayBtn(plain,1)}<em>${en}</em><span>${esc(ph)}</span></div>`;
}
const w=(t)=>[t,P[t]||t,false], a=(t)=>[t,P[t]||t,true];
function tenseTable(v){
  if(v.b==='be'){
    const rows=[
      ['Presente',[[w('I'),a('am')],[w('She'),a('is')],[w('They'),a('are')],[a('Are'),w('you'),['ready?','rédi?',false]]]],
      ['Pasado',[[w('I'),a('was')],[w('They'),a('were')],[a('Were'),w('you'),['there?','der?',false]]]],
      ['Futuro',[[w('I'),a('will'),['be','bi',false]]]],
      ['Presente perfecto',[[w('I'),a('have'),['been','bin',false]],[w('She'),a('has'),['been','bin',false]]]],
      ['Condicional',[[w('I'),a('would'),['be','bi',false]]]]
    ];
    return rows.map(([h,ls])=>`<div class="tense"><h4>${h}</h4>${ls.map(line).join('')}</div>`).join('');
  }
  const B=[v.b,v.bf,false],Pa=[v.p,v.pf,false],Pt=[v.pt,v.ptf,false],G=[v.g,v.gf,false];
  const [ss,sp]=sForm(v);const S=[ss,sp,false];
  const rows=[
    ['Presente simple (sin auxiliar en afirmativo; do/does en preguntas y negación)',[[w('I'),B],[w('She'),S],[a('Do'),w('you'),[v.b+'?',v.bf+'?',false]],[w('She'),a("doesn't"),B]]],
    ['Pasado simple (did en preguntas y negación; el verbo vuelve a su forma base)',[[w('I'),Pa],[a('Did'),w('you'),[v.b+'?',v.bf+'?',false]],[w('I'),a("didn't"),B]]],
    ['Futuro (will + verbo base)',[[w('I'),a('will'),B],[w('I'),a("won't"),B],[a("I'm going to"),B]]],
    ['Presente continuo (am / is / are + -ing)',[[w('I'),a('am'),G],[w('She'),a('is'),G],[w('They'),a('are'),G]]],
    ['Pasado continuo (was / were + -ing)',[[w('I'),a('was'),G],[w('They'),a('were'),G]]],
    ['Presente perfecto (have / has + participio)',[[w('I'),a('have'),Pt],[w('She'),a('has'),Pt]]],
    ['Pasado perfecto (had + participio)',[[w('I'),a('had'),Pt]]],
    ['Condicional (would + verbo base)',[[w('I'),a('would'),B]]]
  ];
  if(v.c!=='Esenciales')rows.push(['Voz pasiva (be + participio)',[[w('It'),a('was'),Pt],[w('It'),a('has'),['been','bin',true],Pt]]]);
  return rows.map(([h,ls])=>`<div class="tense"><h4>${h}</h4>${ls.map(line).join('')}</div>`).join('');
}
const ED={t:'La terminación -ed suena /t/ (ej: worked → "uorkt")',d:'La terminación -ed suena /d/ (ej: played → "pléid")',id:'La terminación -ed suena /id/: agrega una sílaba (ej: wanted → "uántid")',irr:'Verbo irregular: el pasado no termina en -ed, hay que memorizarlo'};

let quiz={mode:'cards',src:'all',dif:'',cur:null,ok:0,bad:0,missed:[],revealed:false,answered:false,opts:[],reviewOnly:false};
function quizPool(){
  let items=allItems();
  if(quiz.mode==='verbs')items=items.filter(i=>i.t==='verbs'&&i.b!=='be');
  else if(quiz.src!=='all')items=items.filter(i=>i.t===quiz.src);
  if(quiz.dif)items=items.filter(i=>lvlOf(i)===quiz.dif);
  if(quiz.reviewOnly){const ids=new Set(quiz.missed);items=items.filter(i=>ids.has(i.id))}
  return items;
}
const qEn=i=>i.t==='verbs'?i.b:i.en, qPh=i=>i.t==='verbs'?i.bf:i.f;
function nextQ(){
  const pool=quizPool();
  if(!pool.length){quiz.cur=null;return}
  quiz.cur=pool[Math.floor(Math.random()*pool.length)];
  quiz.revealed=false;quiz.answered=false;
  if(quiz.mode==='phon'){
    const others=shuffle(allItems().filter(i=>qPh(i)&&qPh(i)!==qPh(quiz.cur))).slice(0,3).map(qPh);
    quiz.opts=shuffle([qPh(quiz.cur),...others]);
  }else if(quiz.mode==='verbs'){
    const others=shuffle(allItems().filter(i=>i.t==='verbs'&&i.p!==quiz.cur.p&&i.b!=='be')).slice(0,3).map(i=>i.p);
    const fake=quiz.cur.tag==='irr'?quiz.cur.b+(quiz.cur.b.endsWith('e')?'d':'ed'):null;
    quiz.opts=shuffle([quiz.cur.p,...(fake&&fake!==quiz.cur.p?[fake]:[]),...others]).slice(0,4);
    if(!quiz.opts.includes(quiz.cur.p))quiz.opts[0]=quiz.cur.p;
  }
}
function mark(ok){
  ok?quiz.ok++:quiz.bad++;
  if(!ok&&!quiz.missed.includes(quiz.cur.id))quiz.missed.push(quiz.cur.id);
  if(ok&&quiz.reviewOnly)quiz.missed=quiz.missed.filter(x=>x!==quiz.cur.id);
}
function renderQuiz(){
  if(!quiz.cur)nextQ();
  const c=quiz.cur;
  const modes=[['cards','Tarjetas'],['phon','Elige la pronunciación'],['verbs','Pasado de verbos']];
  const srcs=[['all','Todas'],['work','Trabajo'],['daily','Día a día'],['legal','Legal'],['jur','Inglés jurídico'],['verbs','Verbos'],['trap','Trampas']];
  let body='';
  if(!c){body=`<div class="empty">${quiz.reviewOnly?'No quedan palabras falladas. Buen trabajo.':'No hay palabras en esta selección.'}</div>`}
  else if(quiz.mode==='cards'){
    body=`<div class="quiz-card"><div class="quiz-sub">¿Cómo se pronuncia y qué significa?</div>
      <div class="quiz-prompt">${esc(qEn(c))}</div>
      ${quiz.revealed?`<div class="reveal"><div style="display:flex;justify-content:center">${c.t==='verbs'?pron(c.bf,c.bi,c.bs||c.b):pron(c.f,c.i,spokenOf(c))}</div><div class="es">${esc(c.es)}</div>${c.ex&&c.ex!==c.en?exLine(c.ex):''}${c.n?`<div class="note" style="text-align:left">${esc(c.n)}</div>`:''}</div>
        <div class="options" style="grid-template-columns:1fr 1fr"><button type="button" class="opt" data-q="no">Repasar</button><button type="button" class="opt right" data-q="yes">La sabía</button></div>`
      :`<div class="options"><button type="button" class="opt" data-q="show">Mostrar respuesta</button></div>`}</div>`;
  }else{
    const isV=quiz.mode==='verbs';
    const correct=isV?c.p:qPh(c);
    body=`<div class="quiz-card"><div class="quiz-sub">${isV?'¿Cuál es el pasado de…?':'¿Cómo se pronuncia?'}</div>
      <div class="quiz-prompt">${esc(qEn(c))}</div>${isV?`<div class="quiz-sub">${esc(c.es)}</div>`:''}
      <div class="options">${quiz.opts.map(o=>{let cls='';if(quiz.answered){if(o===correct)cls='right';else if(o===quiz.picked)cls='wrong'}return `<button type="button" class="opt ${cls}" data-pick="${esc(o)}" ${quiz.answered?'disabled':''}>${esc(o)}</button>`}).join('')}</div>
      ${quiz.answered?`<div class="reveal">${isV?`<div style="display:flex;justify-content:center"><div class="pron">${sayBtn(c.ps||c.p.split(' / ').join(', '))}<span class="phon">${esc(c.p)}: ${esc(c.pf)}</span>${ipaSpan(c.pi)}</div></div><div class="es">Participio: ${esc(c.pt)} (${esc(c.ptf)})</div><div class="edtag">${ED[c.tag]||''}</div>`:`<div style="display:flex;justify-content:center">${pron(qPh(c),c.t==='verbs'?c.bi:c.i,c.t==='verbs'?(c.bs||c.b):spokenOf(c))}</div><div class="es">${esc(c.es)}</div>${c.ex&&c.ex!==c.en?exLine(c.ex):''}`}
        <div class="options"><button type="button" class="opt" data-q="next">Siguiente</button></div></div>`:''}
    </div>`;
  }
  $('#main').innerHTML=`
    <div class="seg" role="group" aria-label="Modo">${modes.map(([k,l])=>`<button type="button" aria-pressed="${quiz.mode===k}" data-mode="${k}">${l}</button>`).join('')}</div>
    <div class="filters">${quiz.mode!=='verbs'?`<select id="qsrc" aria-label="Palabras a practicar">${srcs.map(([k,l])=>`<option value="${k}" ${quiz.src===k?'selected':''}>${l}</option>`).join('')}</select>`:''}${difSelect('qdif',quiz.dif)}</div>
    ${body}
    <div class="score"><span>Correctas: ${quiz.ok} · Por repasar: ${quiz.bad}</span>
      ${quiz.missed.length||quiz.reviewOnly?`<button type="button" class="linkbtn" data-q="review">${quiz.reviewOnly?'Practicar todas':'Repasar falladas ('+quiz.missed.length+')'}</button>`:''}</div>`;
  const s=$('#qsrc');if(s)s.onchange=e=>{quiz.src=e.target.value;quiz.cur=null;renderQuiz()};
  $('#qdif').onchange=e=>{quiz.dif=e.target.value;quiz.cur=null;renderQuiz()};
  document.querySelectorAll('#main [data-mode]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();quizAction('mode',b.dataset.mode)}));
  document.querySelectorAll('#main [data-pick]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();quizAction('pick',b.dataset.pick)}));
  document.querySelectorAll('#main [data-q]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();quizAction('q',b.dataset.q)}));
}
function quizAction(kind,val){
  if(kind==='mode'){quiz.mode=val;quiz.cur=null}
  else if(kind==='pick'){if(quiz.answered||!quiz.cur)return;const correct=quiz.mode==='verbs'?quiz.cur.p:qPh(quiz.cur);quiz.picked=val;quiz.answered=true;mark(val===correct)}
  else if(val==='show'){quiz.revealed=true}
  else if(val==='yes'||val==='no'){mark(val==='yes');nextQ()}
  else if(val==='next'){nextQ()}
  else if(val==='review'){quiz.reviewOnly=!quiz.reviewOnly;quiz.cur=null}
  renderQuiz();
}

/* ---------- agregar ---------- */
const dlg=$('#dlg');
const closeDlg=()=>{dlg.close?dlg.close():dlg.removeAttribute('open')};
function openAdd(){
  ['fEn','fPh','fEs','fCat','fEx','fNote'].forEach(id=>$('#'+id).value='');
  $('#fErr').textContent='';
  if(['work','daily','legal','jur','trap'].includes(state.tab))$('#fType').value=state.tab;
  dlg.showModal?dlg.showModal():dlg.setAttribute('open','');
}
$('#fCancel').onclick=closeDlg;
$('#fSave').onclick=()=>{
  const en=$('#fEn').value.trim(),f=$('#fPh').value.trim(),es=$('#fEs').value.trim();
  if(!en||!f||!es){$('#fErr').textContent='Completa la palabra, su pronunciación y su significado.';return}
  custom.push({t:$('#fType').value,c:$('#fCat').value.trim()||'Mis palabras',en,f,es,d:$('#fDif').value,ex:$('#fEx').value.trim(),n:$('#fNote').value.trim(),id:'c:'+Date.now()});
  save(K_CUSTOM,custom);closeDlg();render();
};

renderTabs();render();renderSpeed();
document.getElementById('speed').addEventListener('click',()=>{TTS.slow=!TTS.slow;save('pron_v2_slow',TTS.slow);renderSpeed();speak(TTS.slow?'Slow speed':'Normal speed')});
